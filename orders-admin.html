async function load(){if(loading)return;loading=true;viewControls();el('message').textContent='讀取訂單中…';try{const rows=await api('/rest/v1/orders?select=*&deleted_at='+(el('show-deleted').checked?'not.is.null':'is.null')+orderStatusFilter(orderView,el('show-deleted').checked)+searchFilter()+'&order=created_at.desc,id.desc&limit=50&offset='+offset);el('orders').replaceChildren();for(const o of rows){const card=document.createElement('article'),title=document.createElement('h2'),details=document.createElement('pre');title.textContent=o.short_number?"LX-"+o.short_number:o.order_number;details.textContent=[new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),o.recipient_name+' ／ '+o.phone,o.email,methods[o.delivery_method]+' ／ '+payMethods[o.payment_method],o.district+' '+o.address,o.store_details?'7‑11 門市：'+o.store_details.name+' ／ '+o.store_details.area+(o.store_details.code?' ／ 代號 '+o.store_details.code:''):'',o.short_number&&o.order_number!=='LX-'+o.short_number?'原訂單編號：'+o.order_number:'','備註：'+o.notes,'',...o.items.map(i=>i.name+' '+i.spec+' × '+i.quantity+' ／ '+money(i.unit_price_cents*i.quantity)),'商品 '+money(o.subtotal_cents)+' ＋ 運費 '+money(o.shipping_cents)+' ＝ '+money(o.total_cents)].join('\n');const [pl,ps]=select(payments,o.payment_status,'付款狀態'),[sl,ss]=select(states,o.fulfillment_status,'處理狀態');const save=document.createElement('button'),notice=document.createElement('p');notice.setAttribute('role','status');save.textContent='儲存狀態';save.onclick=async()=>{save.disabled=true;try{const updated=await api('/rest/v1/orders?id=eq.'+o.id+'&payment_status=eq.'+o.payment_status+'&fulfillment_status=eq.'+o.fulfillment_status,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payment_status:ps.value,fulfillment_status:ss.value})});if(updated.length!==1)throw Error('此訂單已在其他地方更新，請重新讀取後再修改。');o.payment_status=ps.value;o.fulfillment_status=ss.value;offset=0;await load();el('message').textContent='狀態已儲存。已完成的訂單請到「已完成訂單」查看。'}catch(err){notice.textContent=err.message}finally{save.disabled=false}};const del=document.createElement('button');del.type='button';del.textContent=o.deleted_at?'還原訂單':'刪除訂單';del.style.marginLeft='12px';del.onclick=async()=>{if(!confirm(o.deleted_at?'確認還原這筆訂單？':'確認將這筆訂單移到已刪除清單？此操作不會退款或通知買方，可從已刪除清單還原。'))return;del.disabled=true;try{await api('/rest/v1/orders?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify({deleted_at:o.deleted_at?null:new Date().toISOString()})});await load()}catch(err){notice.textContent=err.message;del.disabled=false}};card.append(title,details,pl,sl,save,del,notice,deliveryEditor(o),deliveryHistory(o),itemsEditor(o),itemsHistory(o));el('orders').append(card)}el('prev').disabled=offset===0;el('next').disabled=rows.length<50;el('message').textContent=rows.length?'第 '+(offset+1)+'–'+(offset+rows.length)+' 筆訂單':'目前沒有訂單'}catch(err){el('message').textContent=err.message}finally{loading=false;viewControls()}}
function searchFilter(){if(!searchValue)return '';const v=searchValue.replace(/^LX-/i,'');return /^\d+$/.test(v)?'&short_number=eq.'+encodeURIComponent(v):'&order_number=ilike.'+encodeURIComponent('*'+searchValue+'*')}
el('search-form').onsubmit=e=>{e.preventDefault();if(loading)return;const v=el('search-order').value.trim();if(v&&!/^[a-zA-Z0-9-]{1,50}$/.test(v)){el('message').textContent='請輸入訂單編號（英數字與連字號）。';return}searchValue=v;offset=0;load()};el('clear-search').onclick=()=>{if(loading)return;el('search-order').value='';searchValue='';offset=0;load()};el('show-deleted').onchange=()=>{offset=0;load()};el('refresh').onclick=load;el('logout').onclick=()=>{logout();el('message').textContent='已登出'};el('prev').onclick=()=>{if(!loading){offset=Math.max(0,offset-50);load()}};el('next').onclick=()=>{if(!loading){offset+=50;load()}};
function deliveryEditor(o){

 const form=document.createElement('form');

 function input(label,value,max){const l=document.createElement('label');l.textContent=label+' ';const x=document.createElement('input');x.value=value||'';x.maxLength=max;x.style.width='100%';l.append(x);return [l,x]}
 const [al,address]=input('收件地址',o.address,300),[nl,storeName]=input('7‑11 門市名稱',o.store_details?.name,80),[sl,storeArea]=input('7‑11 地區／地址',o.store_details?.area,200);

function deliveryHistory(o){const box=document.createElement('details'),heading=document.createElement('summary');heading.textContent='收件與運費調整紀錄（'+(o.delivery_changes?.length||0)+'）';box.append(heading);for(const change of o.delivery_changes||[]){const p=document.createElement('pre');p.textContent=new Date(change.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'\n原因：'+change.reason+'\n'+methods[change.before.delivery]+' → '+methods[change.after.delivery]+'\n運費 '+money(change.before.shipping_cents)+' → '+money(change.after.shipping_cents)+'\n原地址：'+(change.before.address||change.before.store?.area||'—')+'\n新地址：'+(change.after.address||change.after.store?.area||'—');box.append(p)}return box}


function adjustedItemsTotal(o,items){
 const subtotal=items.reduce((n,i)=>n+i.unit_price_cents*i.quantity,0);
 const standard=['pickup','local'].includes(o.delivery_method)||subtotal>=300000?0:o.delivery_method==='home'?29900:12900;
 const shipping=o.shipping_adjusted?Math.min(o.shipping_cents,standard):standard;
 return {subtotal,shipping,total:subtotal+shipping};
}

 let items=structuredClone(o.items),catalog=null;
 const form=make('form'),list=make('div'),searchLabel=make('label','搜尋並新增商品'),search=make('input'),choice=make('select'),add=make('button','加入訂單'),catalogState=make('p'),preview=make('p'),reasonLabel=make('label','調整原因（必填）'),reason=make('input'),agreementLabel=make('label'),agreement=make('input'),save=make('button','儲存商品調整'),result=make('p');

 function totals(){agreement.checked=false;const t=adjustedItemsTotal(o,items);preview.textContent='調整後：商品 '+money(t.subtotal)+' ＋ 運費 '+money(t.shipping)+' ＝ '+money(t.total)+'（原總額 '+money(o.total_cents)+'）';result.textContent='';}
 function draw(){list.replaceChildren();items.forEach((item,index)=>{const row=make('div');row.style.cssText='border-bottom:1px solid #e4d8c7;padding:12px 0';const label=make('label',item.name+' '+(item.spec||'')+' ／ 單價 '+money(item.unit_price_cents)+' ／ 數量 '),qty=make('input'),remove=make('button','移除此商品');qty.type='number';qty.min='1';qty.max='99';qty.step='1';qty.required=true;qty.value=item.quantity;qty.style.width='85px';qty.oninput=()=>{item.quantity=Number(qty.value);totals()};remove.type='button';remove.onclick=()=>{items.splice(index,1);draw()};label.append(qty);row.append(label,remove);list.append(row)});totals();}

 return box;
}
function itemsHistory(o){const box=document.createElement('details'),heading=document.createElement('summary');heading.textContent='商品調整紀錄（'+(o.item_changes?.length||0)+'）';box.append(heading);for(const c of o.item_changes||[]){const p=document.createElement('pre'),lines=x=>x.items.map(i=>i.name+' '+(i.spec||'')+' × '+i.quantity+' ／ 單價 '+money(i.unit_price_cents)).join('\n');p.textContent=new Date(c.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'\n原因：'+c.reason+'\n原商品：\n'+lines(c.before)+'\n調整後：\n'+lines(c.after)+'\n總額 '+money(c.before.total_cents)+' → '+money(c.after.total_cents);box.append(p)}return box}
