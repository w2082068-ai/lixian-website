<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>訂單管理｜儷鮮嚴選</title><style>body{font:16px/1.7 system-ui;background:#f7f2ea;color:#4c392d;margin:0}main{max-width:1000px;margin:auto;padding:24px}section,article{background:#fffdf9;padding:22px;border:1px solid #e4d8c7;border-radius:16px;margin:16px 0}input,select,button{font:inherit;padding:10px;border:1px solid #cbbda9;border-radius:8px}label{display:block;margin:12px 0}button{cursor:pointer}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}a{color:inherit}.row{display:flex;gap:12px;flex-wrap:wrap}button:disabled{opacity:.5}input{max-width:90%}[hidden]{display:none!important}</style><main><a href="./admin.html">返回管理入口</a><h1>儷鮮嚴選・訂單管理</h1><p id="message" role="status"></p><form id="login"><section><h2>店主登入</h2><label>Email <input id="email" type="email" autocomplete="username" value="w2082068@gmail.com" required></label><label>密碼 <input id="password" type="password" autocomplete="current-password" required></label><button>登入訂單管理</button><p>登入後可查看客人資料。重新整理頁面後需重新登入。</p></section></form><section id="tools" hidden><div class="row"><button id="refresh">重新讀取訂單</button><button id="logout">登出</button></div><p>付款截圖僅供核對，確認實際入帳後再標記「已付款」。</p><form id="search-form"><label>快速搜尋訂單編號 <input id="search-order" placeholder="例如 LX-100001 或 100001"></label><button>搜尋</button><button id="clear-search" type="button">清除搜尋</button><label><input id="show-deleted" type="checkbox">查看已刪除訂單</label></form><div id="orders"></div><div class="row"><button id="prev">上一頁</button><button id="next">下一頁</button></div></section></main><script>
'use strict';
const base='https://dxwgggmlpqmdqzlhzali.supabase.co',key='sb_publishable_1a8U-p7BUm3Tn8bFEhxuOA_d5ry8dow';
const el=id=>document.getElementById(id);let token='',offset=0,loading=false,searchValue='';
const payments={pending:'待核款／待付款',paid:'已付款',refunded:'已退款'},states={new:'新訂單',preparing:'備貨中',shipped:'已出貨',ready:'可取貨',completed:'已完成',cancelled:'已取消'},methods={pickup:'店面自取',home:'黑貓宅配',local:'桃園店家配送',seven:'7‑11 冷凍取貨'},payMethods={cod:'貨到付款（桃園配送）',pickup:'門市付款',transfer:'匯款',linepay:'LINE Pay'};
function money(x){return 'NT$ '+(x/100).toLocaleString('zh-TW')}
async function api(path,options={}){const r=await fetch(base+path,{...options,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...options.headers},cache:'no-store'});const data=r.status===204?null:await r.json();if(!r.ok){if(r.status===401){logout();throw Error('登入已過期，請重新登入。')}throw Error(data?.code==='P0001'?data.message:'操作未完成，請重試或確認登入權限。')}return data}
function logout(){token='';el('orders').replaceChildren();el('tools').hidden=true;el('login').hidden=false;el('password').value=''}
el('login').onsubmit=async e=>{e.preventDefault();const button=el('login').querySelector('button');button.disabled=true;try{const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:el('email').value.trim(),password:el('password').value})});const auth=await r.json();if(!r.ok||!auth.access_token)throw Error('登入失敗，請檢查信箱及密碼。');token=auth.access_token;el('password').value='';const admins=await api('/rest/v1/store_admins?select=user_id&user_id=eq.'+encodeURIComponent(auth.user.id));if(admins.length!==1){logout();throw Error('此帳號沒有訂單管理權限。')}el('login').hidden=true;el('tools').hidden=false;offset=0;await load()}catch(err){el('message').textContent=err.message}finally{button.disabled=false}};
function select(values,value,label){const l=document.createElement('label');l.textContent=label+' ';const s=document.createElement('select');Object.entries(values).forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)});s.value=value;l.append(s);return [l,s]}
async function load(){if(loading)return;loading=true;el('message').textContent='讀取訂單中…';try{const rows=await api('/rest/v1/orders?select=*&deleted_at='+(el('show-deleted').checked?'not.is.null':'is.null')+searchFilter()+'&order=created_at.desc,id.desc&limit=50&offset='+offset);el('orders').replaceChildren();for(const o of rows){const card=document.createElement('article'),title=document.createElement('h2'),details=document.createElement('pre');title.textContent=o.short_number?"LX-"+o.short_number:o.order_number;details.textContent=[new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),o.recipient_name+' ／ '+o.phone,o.email,methods[o.delivery_method]+' ／ '+payMethods[o.payment_method],o.district+' '+o.address,o.store_details?'7‑11 門市：'+o.store_details.name+' ／ '+o.store_details.area+(o.store_details.code?' ／ 代號 '+o.store_details.code:''):'',o.short_number&&o.order_number!=='LX-'+o.short_number?'原訂單編號：'+o.order_number:'','備註：'+o.notes,'',...o.items.map(i=>i.name+' '+i.spec+' × '+i.quantity+' ／ '+money(i.unit_price_cents*i.quantity)),'商品 '+money(o.subtotal_cents)+' ＋ 運費 '+money(o.shipping_cents)+' ＝ '+money(o.total_cents)].join('\n');const [pl,ps]=select(payments,o.payment_status,'付款狀態'),[sl,ss]=select(states,o.fulfillment_status,'處理狀態');const save=document.createElement('button'),notice=document.createElement('p');notice.setAttribute('role','status');save.textContent='儲存狀態';save.onclick=async()=>{save.disabled=true;try{const updated=await api('/rest/v1/orders?id=eq.'+o.id+'&payment_status=eq.'+o.payment_status+'&fulfillment_status=eq.'+o.fulfillment_status,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payment_status:ps.value,fulfillment_status:ss.value})});if(updated.length!==1)throw Error('此訂單已在其他地方更新，請重新讀取後再修改。');o.payment_status=ps.value;o.fulfillment_status=ss.value;notice.textContent='已儲存'}catch(err){notice.textContent=err.message}finally{save.disabled=false}};const del=document.createElement('button');del.type='button';del.textContent=o.deleted_at?'還原訂單':'刪除訂單';del.style.marginLeft='12px';del.onclick=async()=>{if(!confirm(o.deleted_at?'確認還原這筆訂單？':'確認將這筆訂單移到已刪除清單？此操作不會退款或通知買方，可從已刪除清單還原。'))return;del.disabled=true;try{await api('/rest/v1/orders?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify({deleted_at:o.deleted_at?null:new Date().toISOString()})});await load()}catch(err){notice.textContent=err.message;del.disabled=false}};card.append(title,details,pl,sl,save,del,notice,deliveryEditor(o),deliveryHistory(o));el('orders').append(card)}el('prev').disabled=offset===0;el('next').disabled=rows.length<50;el('message').textContent=rows.length?'第 '+(offset+1)+'–'+(offset+rows.length)+' 筆訂單':'目前沒有訂單'}catch(err){el('message').textContent=err.message}finally{loading=false}}
function searchFilter(){if(!searchValue)return '';const v=searchValue.replace(/^LX-/i,'');return /^\d+$/.test(v)?'&short_number=eq.'+encodeURIComponent(v):'&order_number=ilike.'+encodeURIComponent('*'+searchValue+'*')}
el('search-form').onsubmit=e=>{e.preventDefault();if(loading)return;const v=el('search-order').value.trim();if(v&&!/^[a-zA-Z0-9-]{1,50}$/.test(v)){el('message').textContent='請輸入訂單編號（英數字與連字號）。';return}searchValue=v;offset=0;load()};el('clear-search').onclick=()=>{if(loading)return;el('search-order').value='';searchValue='';offset=0;load()};el('show-deleted').onchange=()=>{offset=0;load()};el('refresh').onclick=load;el('logout').onclick=()=>{logout();el('message').textContent='已登出'};el('prev').onclick=()=>{if(!loading){offset=Math.max(0,offset-50);load()}};el('next').onclick=()=>{if(!loading){offset+=50;load()}};
function deliveryEditor(o){
 const box=document.createElement('details'),heading=document.createElement('summary');heading.textContent='調整收件方式與運費';box.append(heading);box.style.cssText='border:1px solid #d8cbbb;border-radius:12px;padding:14px;margin-top:18px';
 const disabled=['shipped','completed','cancelled'].includes(o.fulfillment_status)||o.deleted_at;
 if(disabled){const p=document.createElement('p');p.textContent='已出貨、已完成、已取消或已刪除的訂單不可在此調整。';box.append(p);return box}
 const form=document.createElement('form');
 const [dl,delivery]=select(methods,o.delivery_method,'收件方式');
 function input(label,value,max){const l=document.createElement('label');l.textContent=label+' ';const x=document.createElement('input');x.value=value||'';x.maxLength=max;x.style.width='100%';l.append(x);return [l,x]}
 const [al,address]=input('收件地址',o.address,300),[nl,storeName]=input('7‑11 門市名稱',o.store_details?.name,80),[sl,storeArea]=input('7‑11 地區／地址',o.store_details?.area,200);
 const districts=Object.fromEntries(['桃園區','中壢區','八德區','平鎮區','楊梅區','蘆竹區','大溪區','龍潭區','龜山區','大園區','觀音區','新屋區'].map(x=>[x,x]));
 const [rl,district]=select(districts,o.district||'八德區','桃園配送行政區');
 const [pl,payment]=select(payMethods,o.payment_method,'付款方式');
 const [fl,feeMode]=select({standard:'依標準計算',free:'優待免運',custom:'自訂優惠運費'},o.shipping_adjusted?(o.shipping_cents===0?'free':'custom'):'standard','運費設定');
 const [cl,custom]=input('優惠後運費（元）',String(o.shipping_cents/100),12);custom.type='number';custom.min='0';custom.step='0.01';
 const [reasonLabel,reason]=input('調整原因（必填）','',300);reason.required=true;
 const preview=document.createElement('p'),warning=document.createElement('p'),result=document.createElement('p'),button=document.createElement('button');result.setAttribute('role','status');preview.setAttribute('aria-live','polite');button.type='submit';button.textContent='儲存收件與運費調整';warning.textContent='此處只更新訂單，不會自動通知買方、退款或補收款。已付款訂單請另外核對差額。';warning.style.fontSize='14px';
 function standard(){return ['pickup','local'].includes(delivery.value)||o.subtotal_cents>=300000?0:delivery.value==='home'?29900:12900}
 function amount(){return feeMode.value==='standard'?standard():feeMode.value==='free'?0:Math.round(Number(custom.value)*100)}
 function update(){const d=delivery.value;al.hidden=!['home','local'].includes(d);address.required=!al.hidden;rl.hidden=d!=='local';nl.hidden=sl.hidden=d!=='seven';storeName.required=storeArea.required=d==='seven';cl.hidden=feeMode.value!=='custom';custom.required=!cl.hidden;custom.disabled=cl.hidden;address.disabled=al.hidden;district.disabled=rl.hidden;storeName.disabled=nl.hidden;storeArea.disabled=sl.hidden;custom.max=String(standard()/100);const option=Array.from(payment.options).find(x=>x.value==='pickup');option.disabled=d!=='pickup';const codOption=Array.from(payment.options).find(x=>x.value==='cod');codOption.disabled=d!=='local';if(d!=='local'&&payment.value==='cod')payment.value='transfer';if(d!=='pickup'&&payment.value==='pickup')payment.value='transfer';const n=amount();preview.textContent='標準運費 '+money(standard())+'；調整後運費 '+(Number.isFinite(n)?money(n):'請填寫')+'；訂單總額 '+(Number.isFinite(n)?money(o.subtotal_cents+n):'待確認');result.textContent=''}
 delivery.onchange=update;feeMode.onchange=update;custom.oninput=update;
 form.addEventListener('invalid',()=>{result.textContent='請檢查必填資料及優惠運費，修正後再儲存。'},true);
 form.append(dl,al,rl,nl,sl,pl,fl,cl,preview,reasonLabel,warning,button,result);box.append(form);update();
 form.onsubmit=async e=>{e.preventDefault();const shipping=amount();if(!Number.isSafeInteger(shipping)||shipping<0||shipping>standard()){result.textContent='優惠運費不得低於 0 或高於標準運費。';return}if(delivery.value==='local'&&o.subtotal_cents<50000){result.textContent='桃園店家配送需商品滿 500 元。';return}if(!reason.value.trim()){result.textContent='請填寫調整原因。';return}if(!confirm('確認修改這筆訂單？\n收件方式：'+methods[delivery.value]+'\n運費：'+money(o.shipping_cents)+' → '+money(shipping)+'\n新總額：'+money(o.subtotal_cents+shipping)+'\n此操作不會自動退款或通知買方。'))return;button.disabled=true;result.textContent='儲存中，請稍候…';try{await api('/rest/v1/rpc/admin_adjust_delivery',{method:'POST',body:JSON.stringify({p_order_id:o.id,p_version:o.delivery_version||0,p_delivery:delivery.value,p_address:['home','local'].includes(delivery.value)?address.value.trim():'',p_district:delivery.value==='local'?district.value:'',p_store:delivery.value==='seven'?{name:storeName.value,area:storeArea.value}:null,p_shipping:shipping,p_payment:payment.value,p_reason:reason.value.trim()})});await load();el('message').textContent='收件方式與運費已更新，請通知買方確認。'}catch(err){result.textContent=err.message;button.disabled=false}};
 return box;
}
function deliveryHistory(o){const box=document.createElement('details'),heading=document.createElement('summary');heading.textContent='收件與運費調整紀錄（'+(o.delivery_changes?.length||0)+'）';box.append(heading);for(const change of o.delivery_changes||[]){const p=document.createElement('pre');p.textContent=new Date(change.at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'\n原因：'+change.reason+'\n'+methods[change.before.delivery]+' → '+methods[change.after.delivery]+'\n運費 '+money(change.before.shipping_cents)+' → '+money(change.after.shipping_cents)+'\n原地址：'+(change.before.address||change.before.store?.area||'—')+'\n新地址：'+(change.after.address||change.after.store?.area||'—');box.append(p)}return box}


</script></html>
