<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>儷鮮嚴選｜線上菜單</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2ea;color:#4c392d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;padding-bottom:95px}header{background:#fffdf9;border-bottom:1px solid #e4d8c7;padding:20px 17px;position:sticky;top:0;z-index:5}.brand{font-size:25px;font-weight:900;letter-spacing:4px}.en{font-size:11px;letter-spacing:4px;color:#a88758}.tag{float:right;margin-top:-28px;color:#927754}main{max-width:1000px;margin:auto;padding:18px 15px}.hero{background:linear-gradient(135deg,#fffdf9,#eee2d1);border:1px solid #e3d6c5;border-radius:22px;padding:23px;margin-bottom:15px}.hero h1{margin:0;font-size:28px}.hero p{line-height:1.7;color:#7d6c5b}.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}.nav button{white-space:nowrap;border:1px solid #d8cbbb;background:#fffaf3;border-radius:999px;padding:10px 14px;color:#6c5745;font-weight:700}.nav .on{background:#4c392d;color:white}.section{margin:16px 0 28px}.section h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fffdf9;border:1px solid #e4d8c7;border-radius:18px;overflow:hidden}.pic{aspect-ratio:1;background:#eee5da;display:flex;align-items:center;justify-content:center;color:#a18f7d}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:12px}.name{font-weight:900;font-size:17px}.spec{font-size:13px;color:#887665;margin-top:4px}.price{font-weight:900;color:#986d32;font-size:21px;margin-top:8px}.bottom{position:fixed;bottom:12px;left:12px;right:12px;background:#4c392d;color:white;text-align:center;padding:17px;border-radius:22px;text-decoration:none;font-size:18px;font-weight:900;z-index:20;box-shadow:0 8px 25px #3d2b1d44}.bottom span{font-size:13px;font-weight:500;margin-left:7px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body>
<header><div class="brand">儷鮮嚴選</div><div class="en">MEAT & SEAFOOD</div><div class="tag">線上菜單</div></header><main><section class="hero"><h1>嚴選好食材・每一餐都值得</h1><p>肉品・海鮮・蔬菜・火鍋料理包<br>商品與價格持續更新，歡迎瀏覽線上菜單。</p></section><div id="nav" class="nav"></div><div id="menu"></div></main><a class="bottom" href="https://line.me/R/ti/p/@340dfrur" target="_blank">LINE 立即下單 <span>@340dfrur</span></a>
<script>let data=[];const cats=["全部","肉品｜牛肉","肉品｜豬肉","肉品｜雞肉","肉品｜羊肉","火鍋肉片","海鮮｜魚類","海鮮｜蝦類","海鮮｜龍蝦","海鮮｜花枝／魷魚","海鮮｜貝類","海鮮｜火鍋料／丸類","海鮮｜海鮮加工品","蔬菜類","火鍋料理包","中秋節烤肉專區"];fetch("products.json").then(r=>r.json()).then(d=>{data=d;render("全部")});function render(f){document.getElementById("nav").innerHTML=cats.map(c=>'<button class="'+(c==f?'on':'')+'" onclick="render('+JSON.stringify(c)+')">'+c+'</button>').join("");let a=f=="全部"?data:data.filter(p=>p.category==f);let g={};a.forEach(p=>(g[p.category]??=[]).push(p));document.getElementById("menu").innerHTML=Object.entries(g).map(([c,ps])=>'<section class="section"><h2>'+c+'</h2><div class="grid">'+ps.map(p=>'<article class="card"><div class="pic">'+(p.image?'<img src="'+p.image+'" alt="'+p.name+'">':'商品圖片')+'</div><div class="info"><div class="name">'+p.name+'</div><div class="spec">'+p.spec+'</div>'+(p.price?'<div class="price">$'+Number(p.price).toLocaleString()+'</div>':'')+'</div></article>').join("")+'</div></section>').join("")}</script></body></html>
