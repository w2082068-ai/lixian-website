<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>儷鮮嚴選｜商品管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2ea;color:#4c392d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}.head{background:#fffdf9;padding:20px 16px;border-bottom:1px solid #e4d8c7}.brand{font-size:24px;font-weight:900;letter-spacing:3px}.sub{font-size:11px;color:#a88758;letter-spacing:3px}main{max-width:900px;margin:auto;padding:16px}.box{background:#fffdf9;border:1px solid #e2d6c6;border-radius:18px;padding:16px;margin-bottom:14px}.box h2{font-size:18px;margin:0 0 10px}input,select{width:100%;padding:10px;border:1px solid #ddcfbd;border-radius:10px;margin:4px 0 8px;background:white}label{font-size:12px;color:#796958}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{background:white;border:1px solid #e3d8ca;border-radius:15px;padding:12px;margin:10px 0}.actions{display:flex;gap:8px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:800}.add{background:#e9ddcd}.publish{background:#4c392d;color:white}.del{background:#f3dddd;color:#8d3434}.note{font-size:13px;line-height:1.7}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="head"><div class="brand">儷鮮嚴選</div><div class="sub">商品管理・自己更新・發布官網</div></div><main>
<div class="box"><h2>① GitHub 連線</h2><label>你的 GitHub Fine-grained Token</label><input id="token" type="password" placeholder="只在這個瀏覽器工作階段使用"><div class="note">請不要把 Token 傳給任何人，也不要貼在公開貼文。它只用來讓這個管理頁更新你的 lixian-website。</div></div>
<div class="box"><h2>② 商品</h2><button class="add" onclick="add()">＋ 新增商品</button><div id="list"></div></div>
<div class="box"><h2>③ 發布</h2><button class="publish" onclick="publish()">發布全部變更到官網</button><p id="msg" class="note"></p></div></main>
<script>
const owner="w2082068-ai",repo="lixian-website",branch="main";let ps=[];let files={};const cats=["肉品｜牛肉","肉品｜豬肉","肉品｜雞肉","肉品｜羊肉","火鍋肉片","海鮮｜魚類","海鮮｜蝦類","海鮮｜龍蝦","海鮮｜花枝／魷魚","海鮮｜貝類","海鮮｜火鍋料／丸類","海鮮｜海鮮加工品","蔬菜類","火鍋料理包","中秋節烤肉專區"];
function headers(){return {"Accept":"application/vnd.github+json","Authorization":"Bearer "+document.getElementById("token").value,"Content-Type":"application/json"}}
async function get(path){let r=await fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+path,{headers:headers()});if(!r.ok)throw Error("GitHub 讀取失敗："+r.status);return r.json()}
async function load(){try{let x=await get("products.json");ps=JSON.parse(decodeURIComponent(escape(atob(x.content.replace(/\n/g,"")))));render()}catch(e){document.getElementById("msg").textContent=e.message}}
document.getElementById("token").addEventListener("change",load);
function render(){document.getElementById("list").innerHTML=ps.map((p,i)=>'<div class="item"><label>商品名稱</label><input data-i="'+i+'" data-k="name" value="'+esc(p.name)+'"><div class="row"><div><label>分類</label><select data-i="'+i+'" data-k="category">'+cats.map(c=>'<option '+(c==p.category?'selected':'')+'>'+c+'</option>').join("")+'</select></div><div><label>價格</label><input data-i="'+i+'" data-k="price" value="'+esc(p.price||"")+'"></div></div><label>規格</label><input data-i="'+i+'" data-k="spec" value="'+esc(p.spec||"")+'"><label>圖片</label><input type="file" accept="image/*" onchange="pick(this,'+i+')"><div class="actions"><button class="del" onclick="del('+i+')">刪除</button></div></div>').join("")}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function sync(){document.querySelectorAll("[data-i][data-k]").forEach(e=>ps[+e.dataset.i][e.dataset.k]=e.value)}
function add(){ps.push({id:"p-"+Date.now(),category:"肉品｜牛肉",name:"新商品",spec:"",price:"",image:""});render()}function del(i){if(confirm("確定刪除？")){ps.splice(i,1);render()}}
function pick(input,i){let f=input.files[0];if(!f)return;files[i]=f;ps[i].image="images/"+ps[i].id+"."+((f.name.split(".").pop()||"jpg").toLowerCase())}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}async function put(path,content,message,sha){let body={message,content,branch};if(sha)body.sha=sha;let r=await fetch("https://api.github.com/repos/"+owner+"/"+repo+"/contents/"+path,{method:"PUT",headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw Error("發布失敗："+r.status);return r.json()}
async function publish(){sync();let m=document.getElementById("msg");m.textContent="發布中…";try{if(!document.getElementById("token").value)throw Error("請先輸入 GitHub Token");for(const k of Object.keys(files)){let f=files[k];let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});let old=null;try{old=await get(ps[+k].image)}catch(e){}await put(ps[+k].image,data,"更新商品圖片 "+ps[+k].name,old?.sha)}let old=await get("products.json");await put("products.json",b64(JSON.stringify(ps,null,2)),"更新商品資料",old.sha);m.textContent="✅ 已發布！請到官網重新整理。"}catch(e){m.textContent="❌ "+e.message}}
</script></body></html>
